<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Oxford LMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-page">
  <!-- Brand panel -->
  <div class="login-brand-panel">
    <img src="{{ url_for('static', filename='assets/oxford_logo.jpg') }}" alt="Oxford Logo" class="brand-logo-img">
    <h1>Oxford LMS</h1>
    <p>Professional Learning Management System</p>
    <ul class="login-brand-features">
      <li><span class="feat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      </span>Course &amp; Batch Management</li>
      <li><span class="feat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      </span>Student &amp; Attendance Tracking</li>
      <li><span class="feat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      </span>Fee Ledger &amp; Receipts</li>
      <li><span class="feat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </span>Reports &amp; Analytics</li>
    </ul>
  </div>

  <!-- Form panel -->
  <div class="login-form-panel">
    <div class="login-form-inner">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to your Oxford LMS account</p>

      <div class="role-tabs">
        <button class="role-tab active" id="tabAdmin" onclick="setRole('admin')">Admin</button>
        <button class="role-tab" id="tabStudent" onclick="setRole('student')">Student</button>
      </div>

      <div id="alertBox"></div>

      <form id="loginForm" onsubmit="submitLogin(event)">
        <div class="form-group">
          <label id="usernameLabel">Username</label>
          <input class="form-control" type="text" id="username" name="username"
                 placeholder="Enter your username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div style="position:relative;">
            <input class="form-control" type="password" id="password" name="password"
                   placeholder="Enter your password" required autocomplete="current-password"
                   style="padding-right:40px;">
            <button type="button" onclick="togglePwd()" style="position:absolute;right:10px;top:50%;
              transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer;">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" width="16" height="16">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="loginBtn"
                style="margin-top:8px;justify-content:center;padding:11px;">
          Sign In
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  let currentRole = 'admin';

  function setRole(role) {
    currentRole = role;
    document.getElementById('tabAdmin').classList.toggle('active', role === 'admin');
    document.getElementById('tabStudent').classList.toggle('active', role === 'student');
    document.getElementById('usernameLabel').textContent = role === 'student' ? 'Student ID' : 'Username';
    document.getElementById('username').placeholder = role === 'student' ? 'Enter your Student ID' : 'Enter your username';
  }

  function togglePwd() {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
  }

  async function submitLogin(e) {
    e.preventDefault();
    const btn      = document.getElementById('loginBtn');
    const alertBox = document.getElementById('alertBox');
    alertBox.innerHTML = '';
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/dashboard';
      } else {
        alertBox.innerHTML = `<div class="alert alert-error">${data.error || 'Login failed'}</div>`;
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">Network error. Please try again.</div>`;
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }
</script>
</body>
</html>
