<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oxford LMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="{{ url_for('static', filename='assets/oxford_logo.jpg') }}" alt="Oxford Logo" class="logo-box-img">
      <div class="logo-text">
        <div class="name">Oxford LMS</div>
        <div class="tagline">Learning Management System</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Populated by JS -->
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebarUser">
        <img src="" alt="Profile" id="sidebarAvatar">
        <div class="user-info">
          <div class="uname" id="sidebarName">—</div>
          <div class="urole" id="sidebarRole">—</div>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-title" id="pageTitle">Dashboard</div>
      <div class="topbar-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" placeholder="Search..." id="globalSearch">
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="notifBtn" onclick="toggleNotifications()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="notif-badge" id="notifBadge" style="display:none">0</span>
        </button>
        <div class="avatar-btn" onclick="showProfileModal()">
          <img src="" alt="Profile" id="topbarAvatar">
        </div>
      </div>
    </header>

    <!-- Page content -->
    <div class="page" id="pageContent">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- Modal container -->
<div id="modalRoot"></div>

<script src="{{ url_for('static', filename='js/notes_viewer.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
